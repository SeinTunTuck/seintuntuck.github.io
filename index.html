<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SeinTunTuck — GitHub Pages</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(900px, calc(100% - 32px));
        margin: 64px auto;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 2rem;
      }

      .description {
        margin-top: 0;
        color: #6b7280;
      }

      .project {
        margin-top: 32px;
        padding: 24px;
        border: 1px solid #dfe3e8;
        border-radius: 12px;
        background: white;
        box-shadow: 0 4px 14px rgb(0 0 0 / 7%);
      }

      .project h2 {
        margin-top: 0;
      }

      .path {
        display: inline-block;
        margin-bottom: 20px;
        padding: 7px 10px;
        border-radius: 6px;
        background: #eef2ff;
        color: #4338ca;
        font-family: monospace;
      }

      .button {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      .button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>SeinTunTuck</h1>
      <p class="description">Projects deployed through GitHub Pages.</p>

      <section class="project">
        <h2>Midterm Item Manager App</h2>

        <div class="path">/midterm-item-manager-app/</div>

        <br />

        <a class="button" href="./midterm-item-manager-app/">
          Open application
        </a>
      </section>
    </main>
  </body>
</html>
